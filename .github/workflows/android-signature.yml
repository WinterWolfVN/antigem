name: Android Signed APK

on:
  push:
    branches: [ standalone ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (chưa ký)
        run: ./gradlew assembleRelease

      - name: Tạo keystore tạm
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.jks" \
            -alias ci-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=CI, OU=Dev, O=MyApp, L=HCM, C=VN"

      - name: Zipalign và ký APK
        run: |
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS"

          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -1)

          "$TOOLS/zipalign" -v -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias ci-key \
            --ks-pass pass:android123 \
            --key-pass pass:android123 \
            --out app-release-signed.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$TOOLS/apksigner" verify --verbose app-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app-release-signed.apk
